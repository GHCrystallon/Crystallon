# Hugo configuration file
title: Crystallon

# import hextra as module
module:
  imports:
    - path: github.com/imfing/hextra

markup:
  # allow raw html
  goldmark:
    renderer:
      unsafe: true
    parser:
      attribute:
        block: true

  # enable hextra syntax highlight
  highlight:
    noClasses: false

menu:
  main:
    - name: About
      pageRef: /about
      weight: 1
    - name: Documentation
      pageRef: /docs
      weight: 2
    - name: Blog
      pageRef: /blog
      weight: 3
    - name: Download
      weight: 4
      pageRef: /download
    - name: Forum
      weight: 5
      url: "https://discourse.mcneel.com/c/plug-ins/crystallon/"
    - name: Youtube
      weight: 6
      url: "https://www.youtube.com/fequalsf"
    - name: Patreon
      weight: 7
      url: "https://www.patreon.com/c/Crystallon"
    - name: Search
      weight: 8
      params:
        type: search
    - name: GitHub
      weight: 9
      url: "https://github.com/GHCrystallon/Crystallon"
      params:
        icon: github

params:
  description: "Crystallon - Lattice structure tools for Grasshopper3D"

  navbar:
    displayTitle: true
    displayLogo: true
    logo:
      path: favicon.svg
      dark: favicon-dark.svg
      width: 30

  footer:
    displayCopyright: true
    displayPoweredBy: true

  editURL:
    enable: true
    base: "https://github.com/GHCrystallon/Crystallon/edit/docs/content"

enableRobotsTXT: true
